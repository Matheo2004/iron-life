services:
  db:
    image: postgres:15
    container_name: ironlife_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: ironlife
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    image: ironlife-backend:1.0.2
    container_name: ironlife_backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://user:user@db:5432/ironlife?schema=public"
    depends_on:
      - db

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger_ui
    ports:
      - "8080:8080"
    volumes:
      - ./swagger/documentation/swagger.json:/usr/share/nginx/swagger.json
    environment:
      SWAGGER_JSON: /usr/share/nginx/swagger.json
    depends_on:
      - backend
  frontend:
    build: ./frontend
    image: ironlife-frontend:1.0.0
    container_name: ironlife_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
